name: Black Sheep Foods
description: 'Black Sheep Foods is a San Francisco food-technology company making plant-based meat that
  targets the flavors and textures of premium and heritage animal proteins — starting with its signature
  meat-free lamb, plus steak bites, built on a proprietary pea-protein DualTexture blend. Originally
  launched as a restaurant and retail brand (served at Bay Area restaurants and sold as vegan ground
  lamb), the company has increasingly positioned itself as a B2B ingredient supplier, licensing its
  DualTexture protein platform for hybrid and fully plant-based meat products. It is venture-backed
  (investors include Bessemer Venture Partners and AgFunder) and pitches a sustainability story of far
  lower land, water, and greenhouse-gas footprint than conventionally raised lamb. This is a consumer/
  ingredient food-tech business with no first-party public developer API; its web presence runs on
  Shopify.'
